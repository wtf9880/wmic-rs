name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release Windows binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo build --release
      - name: Resolve release tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF.Substring("refs/tags/".Length)
            $prerelease = "false"
          } else {
            $tag = "nightly"
            $prerelease = "true"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=$prerelease"
      #- name: Move nightly tag
      #  if: steps.version.outputs.tag == 'nightly'
      #  shell: pwsh
      #  run: |
      #    git tag -f nightly
      #    git push -f origin nightly
      - name: Name Windows binary
        id: binary
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $binary = "wmic-rs-$env:TAG-windows-x86_64.exe"
          Copy-Item -Path target/release/wmic.exe -Destination $binary
          Add-Content -Path $env:GITHUB_OUTPUT -Value "binary=$binary"
      - uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: ${{ steps.binary.outputs.binary }}
          fail_on_unmatched_files: true
          generate_release_notes: ${{ steps.version.outputs.tag != 'nightly' }}
          body: ${{ steps.version.outputs.tag == 'nightly' && format('Nightly build of {0}.', github.sha) || '' }}
